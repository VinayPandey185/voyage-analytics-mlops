apiVersion: apps/v1
kind: Deployment
metadata:
  name: gender-classifier
  labels:
    app: gender-classifier

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gender-classifier

  template:
    metadata:
      labels:
        app: gender-classifier

    spec:
      containers:
        - name: gender-classifier
          image: travel-gender-api:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5002

          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

          readinessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 5002
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: gender-classifier

spec:
  type: NodePort

  selector:
    app: gender-classifier

  ports:
    - protocol: TCP
      port: 5002
      targetPort: 5002
      nodePort: 31061
